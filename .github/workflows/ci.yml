name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @prh/web build
        env:
          API_BASE_URL: http://localhost:8787
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm --filter @prh/web cf:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm --filter @prh/api build
